<nav class="nav">
  <div class="nav-left">
    <a href="{{ site.baseurl }}/">{{ site.heading }}</a>
  </div>

  <div class="nav-right">
    <div class="nav-links">
      {%- include Search.html nav=true -%}

      {%- if site.menu -%}
        {%- for item in site.menu -%}
          {%- unless item.url == "/notes" or item.title == "Notes" -%}
          <a href="{{ site.baseurl }}{{ item.url }}">{{ item.title }}</a>
          {%- endunless -%}
        {%- endfor -%}
      {%- else -%}
        <a href="{{ site.baseurl }}/about">About</a>
      {%- endif -%}

      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="theme-toggle-thumb">
          <svg class="theme-toggle-sun" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <circle cx="12" cy="4" r="1.5"/>
            <circle cx="12" cy="20" r="1.5"/>
            <circle cx="4" cy="12" r="1.5"/>
            <circle cx="20" cy="12" r="1.5"/>
            <circle cx="6.3" cy="6.3" r="1.5"/>
            <circle cx="17.7" cy="17.7" r="1.5"/>
            <circle cx="6.3" cy="17.7" r="1.5"/>
            <circle cx="17.7" cy="6.3" r="1.5"/>
          </svg>
          <svg class="theme-toggle-moon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </span>
      </button>
    </div>
  </div>
</nav>

{%- include Search.html modal=true -%}

<script>
  const themeToggle = document.querySelector('.theme-toggle');
  const root = document.documentElement;
  const body = document.body;

  function setTheme(theme) {
    if (theme === 'dark') {
      root.setAttribute('data-theme', 'dark');
    } else {
      root.removeAttribute('data-theme');
    }
    localStorage.setItem('theme', theme);
    themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    themeToggle.setAttribute('title', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }

  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) {
    setTheme(savedTheme);
  }

  themeToggle.addEventListener('click', function () {
    root.classList.add('theme-transition');
    body.classList.add('theme-transition');

    const isDark = root.getAttribute('data-theme') === 'dark';
    setTheme(isDark ? 'light' : 'dark');
  });
</script>
