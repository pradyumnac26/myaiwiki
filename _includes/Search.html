{%- if site.preferences.search.enabled -%}
    {%- if include.nav -%}
    <button type="button" class="search-trigger" id="search-trigger" aria-label="Search notes" aria-haspopup="dialog">
        <span class="search-trigger-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/>
                <path d="M20 20l-3.5-3.5"/>
            </svg>
        </span>
        <span class="search-trigger-label">Search…</span>
    </button>
    {%- endif -%}

    {%- if include.modal -%}
    <div class="search-modal" id="search-modal" aria-hidden="true">
        <div class="search-modal-backdrop" id="search-modal-backdrop"></div>
        <div class="search-modal-panel" role="dialog" aria-modal="true" aria-label="Search notes">
            <div class="search-modal-header">
                <span class="search-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="M20 20l-3.5-3.5"/>
                    </svg>
                </span>
                <input class="search-input search-modal-input" type="search" placeholder="Search notes…" id="search-input" autocomplete="off" spellcheck="false">
            </div>
            <div class="search-modal-body">
                <div id="search-results" class="search-results"></div>
            </div>
            <div class="search-modal-footer">
                <div class="search-modal-hints">
                    <span class="search-hint"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
                    <span class="search-hint"><kbd>↵</kbd> Select</span>
                    <span class="search-hint">esc Close</span>
                </div>
                <span class="search-modal-count" id="search-count"></span>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="{{ site.baseurl }}/assets/js/vendor/lunr.min.js"></script>
    <script src="{{ site.baseurl }}/assets/js/Search.js"></script>
    {%- endif -%}
{%- endif -%}
